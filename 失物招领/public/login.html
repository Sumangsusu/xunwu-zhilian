<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 寻物智联</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3B82F6',
                        secondary: '#10B981',
                        accent: '#F59E0B',
                        dark: '#1E293B',
                        light: '#F8FAFC'
                    },
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans SC', 'system-ui', 'sans-serif'],
                        display: ['Inter', 'Noto Sans SC', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="theme-collage bg-slate-900 text-slate-800 font-sans min-h-screen">

    <!-- 登录/注册页 -->
    <div class="fixed inset-0 z-[100] collage-banner flex items-center justify-center p-4">
        <!-- 背景装饰 -->
        <div class="cb-shapes">
            <span class="shape cb-s1"></span><span class="shape cb-s2"></span><span class="shape cb-s3"></span><span class="shape cb-s4"></span>
        </div>
        <div class="cb-dots"></div>
        <div class="absolute inset-0 overflow-hidden pointer-events-none" style="position:absolute;z-index:2">
            
            
            
            <!-- 拼贴主视觉 -->
            <div class="collage-frame tilt-r hidden sm:block" style="right:3%;bottom:7%;width:232px;max-width:28vw;">
                <img src="images/corner-art-v.png" alt="拼贴插画装饰">
            </div>
        </div>

        <div class="relative w-full max-w-md">
            <!-- Logo区域 -->
            <div class="text-center mb-8 slide-up">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-primary to-secondary mb-4 shadow-2xl shadow-primary/30">
                    <i class="fa fa-search text-white text-2xl"></i>
                </div>
                <h1 class="text-3xl font-bold text-white font-display mb-2">寻物智联</h1>
                <p class="text-slate-400">让遗失的物品，找到回家的路</p>
            </div>

            <!-- 登录注册卡片 -->
            <div class="paper-dark-card rounded-3xl p-8 slide-up" style="animation-delay: 0.1s">
                <!-- 切换标签 -->
                <div class="flex bg-white/10 rounded-xl p-1 mb-8">
                    <button id="loginTab" onclick="switchAuthTab('login')" class="flex-1 py-2.5 rounded-lg font-medium text-white bg-white/20 transition-all">
                        登录
                    </button>
                    <button id="registerTab" onclick="switchAuthTab('register')" class="flex-1 py-2.5 rounded-lg font-medium text-slate-400 hover:text-white transition-all">
                        注册
                    </button>
                </div>

                <!-- 登录表单 -->
                <form id="loginForm" class="space-y-5">
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">用户名 / 手机号</label>
                        <div class="relative">
                            <i class="fa fa-user absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                            <input type="text" id="loginUsername" placeholder="请输入用户名或手机号"
                                class="auth-input w-full pl-11 pr-4 py-3 bg-white/10 border border-white/20 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">密码</label>
                        <div class="relative">
                            <i class="fa fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                            <input type="password" id="loginPassword" placeholder="请输入密码"
                                class="auth-input w-full pl-11 pr-11 py-3 bg-white/10 border border-white/20 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all">
                            <button type="button" onclick="togglePassword('loginPassword', this)" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white transition-colors">
                                <i class="fa fa-eye-slash"></i>
                            </button>
                        </div>
                    </div>

                    <div id="loginError" class="hidden text-red-400 text-sm text-center py-2 bg-red-500/10 rounded-lg"></div>

                    <button type="submit" class="btn-glow w-full py-3.5 bg-gradient-to-r from-primary to-secondary text-white rounded-xl font-semibold hover:shadow-lg hover:shadow-primary/30 transition-all transform hover:-translate-y-0.5">
                        登录
                    </button>

                    <p class="text-center text-sm text-slate-500">
                        还没有账号？
                        <button type="button" onclick="switchAuthTab('register')" class="text-primary hover:underline font-medium">立即注册</button>
                    </p>
                </form>

                <!-- 注册表单 -->
                <form id="registerForm" class="space-y-4 hidden">
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">用户名</label>
                        <div class="relative">
                            <i class="fa fa-user absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                            <input type="text" id="regUsername" placeholder="3-20位字符"
                                class="auth-input w-full pl-11 pr-4 py-3 bg-white/10 border border-white/20 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">手机号</label>
                        <div class="relative">
                            <i class="fa fa-mobile absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-lg"></i>
                            <input type="tel" id="regPhone" placeholder="请输入11位手机号"
                                class="auth-input w-full pl-11 pr-4 py-3 bg-white/10 border border-white/20 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">密码</label>
                        <div class="relative">
                            <i class="fa fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                            <input type="password" id="regPassword" placeholder="至少6位字符"
                                class="auth-input w-full pl-11 pr-11 py-3 bg-white/10 border border-white/20 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all">
                            <button type="button" onclick="togglePassword('regPassword', this)" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white transition-colors">
                                <i class="fa fa-eye-slash"></i>
                            </button>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">确认密码</label>
                        <div class="relative">
                            <i class="fa fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                            <input type="password" id="regConfirmPassword" placeholder="再次输入密码"
                                class="auth-input w-full pl-11 pr-4 py-3 bg-white/10 border border-white/20 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all">
                        </div>
                    </div>

                    <div id="registerError" class="hidden text-red-400 text-sm text-center py-2 bg-red-500/10 rounded-lg"></div>
                    <div id="registerSuccess" class="hidden text-green-400 text-sm text-center py-2 bg-green-500/10 rounded-lg"></div>

                    <button type="submit" class="btn-glow w-full py-3.5 bg-gradient-to-r from-primary to-secondary text-white rounded-xl font-semibold hover:shadow-lg hover:shadow-primary/30 transition-all transform hover:-translate-y-0.5 mt-2">
                        注册账号
                    </button>

                    <p class="text-center text-sm text-slate-500">
                        已有账号？
                        <button type="button" onclick="switchAuthTab('login')" class="text-primary hover:underline font-medium">立即登录</button>
                    </p>
                </form>
            </div>

            <!-- 底部说明 -->
            <p class="text-center text-slate-500 text-xs mt-8">
                © 2026 寻物智联 · 让遗失的物品找到回家的路
            </p>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script>
        let currentAuthTab = 'login';

        function switchAuthTab(tab) {
            currentAuthTab = tab;
            const loginTab = document.getElementById('loginTab');
            const registerTab = document.getElementById('registerTab');
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const loginError = document.getElementById('loginError');
            const registerError = document.getElementById('registerError');
            const registerSuccess = document.getElementById('registerSuccess');

            loginError.classList.add('hidden');
            registerError.classList.add('hidden');
            registerSuccess.classList.add('hidden');

            if (tab === 'login') {
                loginTab.classList.add('bg-white/20', 'text-white');
                loginTab.classList.remove('text-slate-400');
                registerTab.classList.remove('bg-white/20', 'text-white');
                registerTab.classList.add('text-slate-400');
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
            } else {
                registerTab.classList.add('bg-white/20', 'text-white');
                registerTab.classList.remove('text-slate-400');
                loginTab.classList.remove('bg-white/20', 'text-white');
                loginTab.classList.add('text-slate-400');
                registerForm.classList.remove('hidden');
                loginForm.classList.add('hidden');
            }
        }

        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            const icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            }
        }

        function showError(element, message) {
            element.textContent = message;
            element.classList.remove('hidden');
        }

        // 登录成功后跳转来源页或首页
        function getNext() {
            const next = new URLSearchParams(location.search).get('next');
            return next || 'index.html';
        }

        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            const errorEl = document.getElementById('loginError');
            const submitBtn = this.querySelector('button[type="submit"]');

            if (!username || !password) {
                showError(errorEl, '请输入用户名和密码');
                return;
            }

            submitBtn.disabled = true;
            const result = await UserDB.login(username, password);
            submitBtn.disabled = false;

            if (result.success) {
                location.href = getNext();
            } else {
                showError(errorEl, result.message);
            }
        });

        document.getElementById('registerForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const username = document.getElementById('regUsername').value.trim();
            const phone = document.getElementById('regPhone').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirmPassword = document.getElementById('regConfirmPassword').value;
            const errorEl = document.getElementById('registerError');
            const successEl = document.getElementById('registerSuccess');
            const submitBtn = this.querySelector('button[type="submit"]');

            if (username.length < 3 || username.length > 20) {
                showError(errorEl, '用户名长度需在3-20位之间');
                return;
            }
            if (!/^1[3-9]\d{9}$/.test(phone)) {
                showError(errorEl, '请输入正确的手机号');
                return;
            }
            if (password.length < 6) {
                showError(errorEl, '密码至少6位字符');
                return;
            }
            if (password !== confirmPassword) {
                showError(errorEl, '两次输入的密码不一致');
                return;
            }

            submitBtn.disabled = true;
            const result = await UserDB.register({ username, password, phone });
            submitBtn.disabled = false;

            if (result.success) {
                successEl.textContent = result.message + '，即将跳转到登录...';
                successEl.classList.remove('hidden');
                errorEl.classList.add('hidden');
                setTimeout(() => {
                    switchAuthTab('login');
                    document.getElementById('loginUsername').value = username;
                }, 1500);
            } else {
                showError(errorEl, result.message);
            }
        });

        // 已登录用户直接进入首页
        document.addEventListener('DOMContentLoaded', async function () {
            const loggedIn = await UserDB.init();
            if (loggedIn) {
                location.href = getNext();
            }
        });
    </script>
</body>
</html>
